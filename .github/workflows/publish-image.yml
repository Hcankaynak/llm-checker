name: Publish image

# Pushing a git tag runs this workflow. The image is published only when the
# tagged commit is on origin/develop. The image tag matches the git tag:
# ghcr.io/<repository>:<git-tag>
on:
  push:
    tags:
      - "**"

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on develop
        id: gate
        run: |
          set -euo pipefail
          if ! git fetch --no-tags origin develop; then
            echo "::error::origin/develop does not exist. Push the develop branch, then tag a commit on it."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on origin/develop, so no image was published."
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tag '${tag}' is not a valid Docker tag. Use letters, digits, underscore, period, and hyphen."
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${image}:${tag} from ${GITHUB_SHA}"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build
        run: ./gradlew --no-daemon --console=plain build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.gate.outputs.image }}:${{ steps.gate.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.gate.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
