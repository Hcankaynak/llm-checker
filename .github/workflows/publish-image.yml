name: Publish image

# A push to main publishes ghcr.io/<repository>:latest.
# A git tag publishes ghcr.io/<repository>:<git-tag> when that commit is on main.
# Version tags stay put. Later commits on main move only :latest.
on:
  push:
    branches:
      - main
    tags:
      - "**"

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Choose the image tag
        id: gate
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if ! git fetch --no-tags origin main; then
              echo "::error::origin/main does not exist. Push main, then tag a commit on it."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
              echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on origin/main, so no image was published."
              exit 1
            fi
            tag="${GITHUB_REF_NAME}"
            if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Tag '${tag}' is not a valid Docker tag. Use letters, digits, underscore, period, and hyphen."
              exit 1
            fi
          else
            tag="latest"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${image}:${tag} from ${GITHUB_SHA}"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build
        run: ./gradlew --no-daemon --console=plain build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.gate.outputs.image }}:${{ steps.gate.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.gate.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
