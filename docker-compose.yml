services:
  llm-checker:
    image: ghcr.io/hcankaynak/llm-checker:latest
    ports:
      - "18642:18642"
    environment:
      VLLM_BASE_URL: "${VLLM_BASE_URL:-}"
      VLLM_API_KEY: "${VLLM_API_KEY:-}"
      VLLM_SKIP_TLS_VERIFY: "${VLLM_SKIP_TLS_VERIFY:-false}"
      VLLM_TIMEOUT_SEC: "${VLLM_TIMEOUT_SEC:-600}"
      MOCK_ENABLED: "${MOCK_ENABLED:-false}"
    volumes:
      - llm-checker-data:/data
    restart: unless-stopped

volumes:
  llm-checker-data:
