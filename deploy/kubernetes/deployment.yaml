apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-checker
  namespace: llm-checker
  labels:
    app.kubernetes.io/name: llm-checker
spec:
  # The data volume is ReadWriteOnce, so keep a single pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-checker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-checker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      # The published image is private. Uncomment this after creating the pull secret
      # named below, or import the image into the cluster registry and leave it off.
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: llm-checker
          image: ghcr.io/hcankaynak/llm-checker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18642
          envFrom:
            - configMapRef:
                name: llm-checker
            - secretRef:
                name: llm-checker
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: llm-checker-data
